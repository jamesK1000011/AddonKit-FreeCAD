# SPDX-License-Identifier: LGPL-2.1-or-later
# AddonKit's tests: the data files and version checks on plain Python 3.9,
# then everything on the newest FreeCAD conda-forge has and the newest 1.1
# and 1.0.
name: AddonKit tests

on:
  push:
    branches: [main, 'test-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Tests without FreeCAD, data files checked
        run: |
          python -m unittest discover -s tests -v
          python -c "import os, sys; sys.path.insert(0, '.'); from addonkit import data; p = data.check_folder('addonkit/data') if os.path.isdir('addonkit/data') else []; print('\n'.join(p) or 'data files: ok'); sys.exit(1 if p else 0)"
  freecad:
    strategy:
      fail-fast: false
      matrix:
        series: ['newest', '1.1', '1.0']
    name: freecad-${{ matrix.series }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: fc-${{ matrix.series }}
          create-args: >-
            -c conda-forge
            ${{ matrix.series == 'newest' && 'freecad' || format('freecad={0}', matrix.series) }}
            python=3.11
            numpy
          cache-environment: true
      - name: Tests on FreeCAD
        # Not exit: a login shell's exit runs ~/.bash_logout, whose
        # clear_console fails on the runner and turns a pass into 1.
        run: |
          code=0
          export FREECAD_LIB="$CONDA_PREFIX/lib"
          python -X faulthandler -m unittest discover -s tests -v || code=$?
          echo "exit code: $code"
          test "$code" -eq 0
